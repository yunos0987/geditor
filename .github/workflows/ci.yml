# Build and test on Windows (release and debug, as AGENTS.md "Build and test").
# A tag vX.Y.Z also packages the release build as geditor-X.Y.Z-windows-x64.zip
# (an artifact of the run; the GitHub release is made by hand from it).

name: CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [release, debug]
    steps:
      - uses: actions/checkout@v5

      # The runner's LLVM (20.x on windows-2025 in 2026-11) is older than the
      # STL of its Visual Studio accepts ("expected Clang 22 or newer"), so
      # install the LLVM that the development PC uses, from the LLVM release
      # on GitHub (choco has no 22.1.3), checked against the SHA-256 that
      # GitHub lists for the asset.
      - name: Tools
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\LLVM-22.1.3-win64.exe"
          Invoke-WebRequest -Uri https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne '72CA54C3B7940615776D8994C0B918A1D8C4981BDCF13B439EAA86A1BD477001') {
            throw "LLVM installer SHA-256 mismatch: $hash"
          }
          $llvm = 'C:\LLVM-22.1.3'
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$llvm" -Wait
          if (-not (Test-Path "$llvm\bin\clang-cl.exe")) { throw "LLVM was not installed in $llvm" }
          "$llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$llvm\bin;$env:PATH"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }
          clang-cl --version
          llvm-rc /? | Select-Object -First 1
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        if: matrix.preset == 'release' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "The tag ${{ github.ref_name }} does not match VERSION $version"
          }
          $dir = "geditor-$version"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/release/geditor.exe, README.md, CHANGELOG.md, LICENSE $dir
          Copy-Item third_party/pcre2/LICENCE.md "$dir/PCRE2-LICENCE.md"
          Compress-Archive -Path $dir -DestinationPath "$dir-windows-x64.zip"
          Get-FileHash "$dir-windows-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload the package
        if: matrix.preset == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: geditor-windows-x64
          path: geditor-*-windows-x64.zip
          if-no-files-found: error
